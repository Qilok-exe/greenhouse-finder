<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenhouse finder — Hampshire County</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="calculator.js"></script>
<script src="data/profiles.js"></script>
<style>
  :root {
    /* One sequential ramp, pale to dark (ColorBrewer YlOrBr-5). No red/green pairing. */
    --band-0: #ffffd4;
    --band-1: #fed98e;
    --band-2: #fe9929;
    --band-3: #d95f0e;
    --band-4: #993404;
    --ink: #1f1a17;
    --muted: #5c534d;
    --line: #e4ddd6;
    --bg: #faf8f5;
    --panel-w: 420px;
    --bar-ms: 900ms;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --bar-ms: 150ms; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  /* Header: figures on one line, finder on its own row beneath, right-aligned */
  header {
    padding: .75rem 1.5rem .6rem;
    border-bottom: 1px solid var(--line);
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }
  /* County total line: large and heavy, tracked tighter as it grows (tracking
     is size-specific). One line where it fits; balanced lines where it does not,
     instead of overflowing. */
  header h1 {
    margin: 0;
    font-size: clamp(1.25rem, 1rem + .7vw, 1.5rem);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    text-wrap: balance;
  }
  header h1 .sep { color: var(--band-2); padding: 0 .4em; }
  /* The dollar figure is the largest element in the header. */
  header h1 .usd {
    font-size: clamp(2rem, 1.5rem + 1.1vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--band-4);
    font-variant-numeric: tabular-nums;
  }
  .finder {
    align-self: flex-end;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  header label { font-size: .9rem; color: var(--muted); }
  header select { font: inherit; font-size: .95rem; padding: .3rem .4rem; max-width: 22rem; }

  /* Layout */
  main {
    display: grid;
    grid-template-columns: 1fr var(--panel-w);
    min-height: 0;
  }
  #map { min-height: 60vh; height: 100%; }
  aside {
    border-left: 1px solid var(--line);
    background: #fff;
    overflow-y: auto;
    padding: 32px 32px 48px;
  }
  /* Wide screens: map 60% on the left, panel 40% on the right, both in view.
     The page itself does not scroll; the panel scrolls on its own. */
  @media (min-width: 1001px) {
    body { overflow: hidden; }
    main { grid-template-columns: 60% 40%; }
    #map { min-height: 0; }
    aside { overscroll-behavior: contain; scrollbar-gutter: stable; }
  }
  @media (max-width: 860px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #map { height: 60vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }

  /* Map controls use the page's system font. */
  .leaflet-container { font-family: inherit; }
  /* Base map switch (Leaflet layers control), laid out like the legend. */
  .leaflet-control-layers.leaflet-control-layers-expanded {
    padding: .5rem .75rem;
    border: 0;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    color: var(--ink);
    font-size: .85rem;
    line-height: 1.6;
  }
  .leaflet-control-layers label { font-size: inherit; cursor: pointer; }
  .leaflet-control-layers-selector { accent-color: var(--band-4); }
  /* Floating map cards (legend and base map switch): a light translucent
     material, solid when the user asks for less transparency or more contrast. */
  .leaflet-control.legend,
  .leaflet-control-layers.leaflet-control-layers-expanded {
    background: rgba(255, 255, 255, .8);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
  }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    .leaflet-control.legend,
    .leaflet-control-layers.leaflet-control-layers-expanded {
      background: #fff;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
  }

  /* Panel: an assessment report. One family, three sizes (13 / 15 / 24px),
     an 8px grid, hairline dividers. Orange is reserved for dollar figures. */
  aside {
    --t-small: 13px;
    --t-body: 15px;
    --t-title: 24px;
    --hair: #e8e2dc;
    --usd: var(--band-4);
    font-size: var(--t-body);
    line-height: 24px;
    font-variant-numeric: tabular-nums;
  }
  .placeholder { margin: 0; color: var(--muted); }
  .panel h2 {
    margin: 0;
    font-size: var(--t-title);
    line-height: 32px;
    font-weight: 600;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .panel h2:focus { outline: none; }
  .meta { margin: 0; color: var(--muted); }
  .usd { color: var(--usd); }

  /* Aerial photo */
  .aerial { margin: 24px 0 0; }
  .aerial-frame {
    position: relative;
    width: 256px;
    height: 256px;
    overflow: hidden;
    border: 1px solid #cfc6bd;
    background: #eeeae5;
  }
  .aerial-frame img { position: absolute; width: 256px; height: 256px; display: block; }
  .aerial figcaption { margin-top: 8px; font-size: var(--t-small); line-height: 16px; color: var(--muted); }

  /* Sections */
  .section { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--hair); }
  .panel h3, #agent-output h3, #agent-output h4 {
    margin: 0 0 8px;
    font-size: var(--t-small);
    line-height: 16px;
    font-weight: 500;
    color: var(--muted);
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .note { margin: 8px 0 0; font-size: var(--t-small); line-height: 20px; color: var(--muted); max-width: 60ch; }

  /* Range: a thin line, low and high ticks, a dot for the best estimate */
  .range-status { font-size: var(--t-small); line-height: 16px; color: var(--muted); }
  .range-figures {
    margin: 8px 0 16px;
    font-size: var(--t-title);
    line-height: 32px;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--usd);
    white-space: nowrap;
  }
  .range-figures .dash { color: var(--muted); font-weight: 400; padding: 0 .2em; }
  .range-track { position: relative; height: 24px; }
  .range-track::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    border-top: 1px solid var(--hair);
  }
  .range-ghost, .range-fill, .range-point, .range-tick, .range-tick-label {
    position: absolute;
    transition:
      left var(--bar-ms) cubic-bezier(.22, .8, .25, 1),
      width var(--bar-ms) cubic-bezier(.22, .8, .25, 1),
      opacity var(--bar-ms) ease;
  }
  .range-ghost { top: 50%; border-top: 1px dashed var(--muted); opacity: 0; }
  .range-ghost.show { opacity: 1; }
  .range-fill { top: 50%; height: 2px; margin-top: -1px; background: var(--ink); }
  .range-tick { top: 6px; width: 1px; height: 12px; margin-left: -.5px; background: var(--ink); }
  .range-point {
    top: 50%;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 0 2px #fff;
  }
  .range-ticks { position: relative; height: 16px; margin-top: 4px; }
  .range-tick-label { top: 0; font-size: var(--t-small); line-height: 16px; color: var(--muted); white-space: nowrap; }
  .no-anim, .no-anim * { transition: none !important; }
  .range-best { margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--hair); }

  /* Calibration form */
  form.calibrate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  form.calibrate label { flex: 1 1 100%; }
  form.calibrate input {
    font: inherit;
    height: 40px;
    padding: 0 8px;
    width: 160px;
    border: 1px solid #b9aea4;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  aside button {
    font: inherit;
    height: 40px;
    padding: 0 16px;
    border-radius: 4px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  aside button.secondary { background: #fff; color: var(--ink); border-color: #b9aea4; }
  aside button:active { transform: scale(.98); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .error { color: #9b1c1c; margin: 8px 0 0; font-size: var(--t-small); line-height: 20px; }

  /* Report tables: label left, value right, hairline rows */
  .report-table, .agent-fixes-table { width: 100%; border-collapse: collapse; }
  .report-table th, .report-table td,
  .agent-fixes-table th, .agent-fixes-table td {
    padding: 8px 0;
    border-bottom: 1px solid var(--hair);
    text-align: left;
    vertical-align: baseline;
    font-weight: 400;
  }
  .report-table th + th, .report-table td + td,
  .agent-fixes-table th + th, .agent-fixes-table td + td { text-align: right; padding-left: 16px; }
  .report-table thead th, .agent-fixes-table tr:first-child th {
    padding-top: 0;
    font-size: var(--t-small);
    line-height: 16px;
    color: var(--muted);
  }
  .report-table tbody th { color: var(--ink); }
  .report-table td.num { white-space: nowrap; }

  /* Grant draft (rendered by agents/browser.js) follows the same report rules */
  #agent-output:not(:empty) { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--hair); }
  #agent-output section + section, #agent-output .agent-fixes-table,
  #agent-output .agent-quote-request, #agent-output .agent-applicant-checks { margin-top: 32px; }
  #agent-output p { margin: 0; max-width: 65ch; }
  #agent-output .agent-error, #agent-output .agent-quote-missing { color: var(--muted); font-size: var(--t-small); line-height: 20px; }
  #agent-output .agent-applicant-checks label { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }

  /* Legend */
  .legend {
    background: #fff;
    padding: .6rem .75rem;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    font-size: .85rem;
    line-height: 1.5;
  }
  .legend strong { display: block; margin-bottom: .25rem; }
  .legend .row { display: flex; align-items: center; gap: .5rem; }
  .legend .sw {
    width: 18px; height: 14px;
    border: 1px solid rgba(0,0,0,.35);
    flex: none;
  }
  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1 id="headline">Loading greenhouses…</h1>
  <div class="finder">
    <label for="jump">Find a greenhouse</label>
    <select id="jump"><option value="">Choose…</option></select>
  </div>
</header>

<main>
  <div id="map" role="region" aria-label="Map of greenhouses"></div>
  <aside aria-label="Selected greenhouse">
    <div id="panel" class="panel">
      <p class="placeholder">Click a greenhouse on the map to see its winter fuel estimate.</p>
    </div>
    <div id="agent-output"></div>
  </aside>
</main>

<script>
(function () {
  'use strict';

  var PROFILES = window.PROFILES;
  var Calc = window.Calculator;
  var headline = document.getElementById('headline');

  if (!Array.isArray(PROFILES) || !Calc) {
    headline.textContent = 'Could not load data/profiles.js or calculator.js.';
    return;
  }

  // ---------- formatting ----------
  var usdFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var intFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  function usd(n) { return usdFmt.format(n); }
  function int(n) { return intFmt.format(n); }

  // Tiny DOM helper. Text always goes in via textContent, never innerHTML.
  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === 'text') node.textContent = attrs[k];
        else if (k === 'class') node.className = attrs[k];
        else node.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  // ---------- header (computed from the data) ----------
  var totalSqft = 0, totalUsd = 0;
  PROFILES.forEach(function (r) { totalSqft += r.sqft; totalUsd += r.usd_winter; });
  headline.textContent = '';
  headline.appendChild(document.createTextNode(int(PROFILES.length) + ' greenhouses'));
  headline.appendChild(h('span', { class: 'sep', 'aria-hidden': 'true', text: '·' }));
  headline.appendChild(document.createTextNode(int(totalSqft) + ' sq ft under cover'));
  headline.appendChild(h('span', { class: 'sep', 'aria-hidden': 'true', text: '·' }));
  headline.appendChild(document.createTextNode('an estimated '));
  headline.appendChild(h('span', { class: 'usd', text: usd(totalUsd) }));
  headline.appendChild(document.createTextNode(' burned this winter'));

  // ---------- colour bands (fixed breaks on usd_winter) ----------
  var BANDS = [
    { max: 3000,     color: getVar('--band-0'), label: 'Under $3,000' },
    { max: 5000,     color: getVar('--band-1'), label: '$3,000 – $5,000' },
    { max: 10000,    color: getVar('--band-2'), label: '$5,000 – $10,000' },
    { max: 25000,    color: getVar('--band-3'), label: '$10,000 – $25,000' },
    { max: Infinity, color: getVar('--band-4'), label: '$25,000 and over' }
  ];
  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function bandColor(v) {
    for (var i = 0; i < BANDS.length; i++) if (v < BANDS[i].max) return BANDS[i].color;
    return BANDS[BANDS.length - 1].color;
  }

  // ---------- map ----------
  var map = L.map('map', { preferCanvas: false });

  // Base maps. The greenhouse polygons and dots live in Leaflet's overlay pane,
  // which sits above the tile pane, so the outlines stay on top of every base map.
  var AERIAL = { maxZoom: 20, attribution: 'MassGIS' };   // MassGIS tile caches go to level 20
  var AERIAL_2025 = 'https://tiles.arcgis.com/tiles/hGdibHYSPO59RG1h/arcgis/rest/services/Massachusetts_Aerial_Imagery_2025/MapServer/tile/{z}/{y}/{x}';
  var baseMaps = {
    'Streets': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }),
    'Aerial 2023': L.tileLayer('https://tiles.arcgis.com/tiles/hGdibHYSPO59RG1h/arcgis/rest/services/orthos2023/MapServer/tile/{z}/{y}/{x}', AERIAL),
    'Aerial 2025': L.tileLayer(AERIAL_2025, AERIAL)
  };
  baseMaps.Streets.addTo(map);
  var basemapSwitch = L.control.layers(baseMaps, null, { position: 'topright', collapsed: false }).addTo(map);
  var baseList = basemapSwitch.getContainer().querySelector('.leaflet-control-layers-base');
  baseList.setAttribute('role', 'radiogroup');
  baseList.setAttribute('aria-label', 'Base map');

  var polygons = L.featureGroup().addTo(map);
  var dots = L.featureGroup();            // shown when zoomed out: buildings are sub-pixel there
  var DOT_ZOOM = 15;
  var layerById = {};
  var selectedId = null;

  function baseStyle(r) {
    return { color: '#3d2a1e', weight: 1, fillColor: bandColor(r.usd_winter), fillOpacity: 0.9 };
  }

  PROFILES.forEach(function (r) {
    // ring is [lon, lat]; Leaflet wants [lat, lon].
    var latlngs = r.ring.map(function (p) { return [p[1], p[0]]; });
    var poly = L.polygon(latlngs, baseStyle(r)).addTo(polygons);
    var dot = L.circleMarker([r.lat, r.lon], {
      radius: 6, color: '#3d2a1e', weight: 1, fillColor: bandColor(r.usd_winter), fillOpacity: 0.95
    }).addTo(dots);
    var tip = (r.name || 'Unnamed greenhouse') + ' — ' + usd(r.usd_winter);
    poly.bindTooltip(tip, { sticky: true });
    dot.bindTooltip(tip);
    poly.on('click', function () { select(r); });
    dot.on('click', function () { select(r); });
    layerById[r.id] = poly;
  });

  // Sanity check on the axis swap: the first polygon should sit on its record's lat/lon.
  (function () {
    var r = PROFILES[0], c = layerById[r.id].getBounds().getCenter();
    if (Math.abs(c.lat - r.lat) > 0.01 || Math.abs(c.lng - r.lon) > 0.01) {
      console.error('ring coordinates look swapped', c, r.lat, r.lon);
    }
  })();

  map.fitBounds(polygons.getBounds(), { padding: [20, 20] });

  function syncDots() {
    if (map.getZoom() < DOT_ZOOM) { if (!map.hasLayer(dots)) dots.addTo(map); }
    else if (map.hasLayer(dots)) map.removeLayer(dots);
  }
  map.on('zoomend', syncDots);
  syncDots();

  // Legend
  var legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    var box = h('div', { class: 'legend' }, [h('strong', { text: 'Fuel cost this winter' })]);
    BANDS.forEach(function (b) {
      var sw = h('span', { class: 'sw', 'aria-hidden': 'true' });
      sw.style.background = b.color;
      box.appendChild(h('div', { class: 'row' }, [sw, h('span', { text: b.label })]));
    });
    return box;
  };
  legend.addTo(map);

  // Keyboard-accessible route to every greenhouse (map polygons are mouse-only).
  var jump = document.getElementById('jump');
  PROFILES.slice()
    .sort(function (a, b) { return b.usd_winter - a.usd_winter; })
    .forEach(function (r) {
      jump.appendChild(h('option', {
        value: r.id,
        text: (r.name || 'Unnamed greenhouse') + ' — ' + int(r.sqft) + ' sq ft, ' + usd(r.usd_winter)
      }));
    });
  jump.addEventListener('change', function () {
    var r = PROFILES.find(function (x) { return x.id === jump.value; });
    if (r) {
      map.flyToBounds(layerById[r.id].getBounds(), { maxZoom: 18, duration: 0.8 });
      select(r);
    }
  });

  // ---------- range bar ----------
  // Rounds up to 1, 2, 2.5 or 5 × 10^k so the axis end label is a clean figure.
  function niceMax(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
    return 10 * p;
  }

  // Counts a number from one value to another in sync with the bar transition.
  function tween(node, from, to, ms) {
    if (node._raf) cancelAnimationFrame(node._raf);
    if (from === to || ms <= 0) { node.textContent = usd(to); return; }
    var t0 = performance.now();
    function frame(t) {
      var k = Math.min(1, (t - t0) / ms);
      var e = 1 - Math.pow(1 - k, 3);
      node.textContent = usd(Math.round(from + (to - from) * e));
      if (k < 1) node._raf = requestAnimationFrame(frame);
    }
    node._raf = requestAnimationFrame(frame);
  }

  function barMs() {
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-ms')) || 0;
  }

  function RangeBar(wide) {
    this.wide = wide;
    this.shown = null;
    this.chip = h('span', { class: 'range-status' });
    this.lowEl = h('span');
    this.highEl = h('span');
    this.figures = h('div', { class: 'range-figures' },
      [this.lowEl, h('span', { class: 'dash', 'aria-hidden': 'true', text: '–' }), this.highEl]);
    this.ghost = h('div', { class: 'range-ghost' });
    this.fill = h('div', { class: 'range-fill' });
    this.lowTick = h('div', { class: 'range-tick' });
    this.highTick = h('div', { class: 'range-tick' });
    this.point = h('div', { class: 'range-point' });
    this.track = h('div', { class: 'range-track', role: 'img' },
      [this.ghost, this.fill, this.lowTick, this.highTick, this.point]);
    this.lowLabel = h('span', { class: 'range-tick-label' });
    this.highLabel = h('span', { class: 'range-tick-label' });
    this.bestEl = h('span', { class: 'usd' });
    this.best = h('div', { class: 'row range-best' }, [h('span', { text: 'Best estimate' }), this.bestEl]);
    this.methodEl = h('p', { class: 'note' });
    this.pointMethodEl = h('p', { class: 'note' });
    this.root = h('div', { class: 'range' }, [
      h('div', { class: 'row' }, [h('h3', { text: 'Estimated fuel cost this winter' }), this.chip]),
      this.figures, this.track,
      h('div', { class: 'range-ticks', 'aria-hidden': 'true' }, [this.lowLabel, this.highLabel]),
      this.best, this.methodEl, this.pointMethodEl
    ]);
  }

  // Puts the low label to the left of its tick and the high label to the right,
  // kept inside the track and clear of each other. Positions are in % of the track.
  RangeBar.prototype.placeLabels = function (lowPct, highPct) {
    var W = this.track.clientWidth;
    if (!W) { this.lowLabel.style.left = lowPct + '%'; this.highLabel.style.left = highPct + '%'; return; }
    var lw = this.lowLabel.offsetWidth, hw = this.highLabel.offsetWidth;
    var lx = Math.min(Math.max(0, lowPct / 100 * W - lw - 4), W - lw);
    var hx = Math.min(Math.max(lx + lw + 8, highPct / 100 * W + 4), W - hw);
    this.lowLabel.style.left = (lx / W * 100) + '%';
    this.highLabel.style.left = (hx / W * 100) + '%';
  };

  RangeBar.prototype.show = function (est, animate) {
    var narrowed = est !== this.wide;
    var max = niceMax(Math.max(this.wide.high.usd, est.high.usd) * 1.05);
    function pct(v) { return (v / max * 100) + '%'; }

    if (!animate) this.root.classList.add('no-anim');

    this.fill.style.left = pct(est.low.usd);
    this.fill.style.width = pct(est.high.usd - est.low.usd);
    this.lowTick.style.left = pct(est.low.usd);
    this.highTick.style.left = pct(est.high.usd);
    this.point.style.left = pct(est.point.usd);
    this.ghost.style.left = pct(this.wide.low.usd);
    this.ghost.style.width = pct(this.wide.high.usd - this.wide.low.usd);
    this.ghost.classList.toggle('show', narrowed);
    this.lowLabel.textContent = 'Low ' + usd(est.low.usd);
    this.highLabel.textContent = 'High ' + usd(est.high.usd);
    this.placeLabels(est.low.usd / max * 100, est.high.usd / max * 100);

    var ms = animate ? barMs() : 0;
    var prev = this.shown || est;
    tween(this.lowEl, prev.low.usd, est.low.usd, ms);
    tween(this.highEl, prev.high.usd, est.high.usd, ms);
    tween(this.bestEl, prev.point.usd, est.point.usd, ms);

    this.chip.textContent = narrowed ? 'Narrowed by your fuel use' : 'Wide range';
    // estimate.method is shown only when it adds something beyond point.method.
    this.methodEl.textContent = est.method !== est.point.method ? est.method : '';
    this.methodEl.hidden = !this.methodEl.textContent;
    this.pointMethodEl.textContent = est.point.method;
    this.track.setAttribute('aria-label',
      'Estimated winter fuel cost between ' + usd(est.low.usd) + ' and ' + usd(est.high.usd) +
      ', best estimate ' + usd(est.point.usd));

    if (!animate) {
      void this.root.offsetWidth;          // commit positions before re-enabling transitions
      this.root.classList.remove('no-anim');
    }
    this.shown = est;
  };

  // ---------- panel ----------
  var panel = document.getElementById('panel');

  // A 256px window of 2025 MassGIS imagery at zoom 18, centred on the record's
  // lat/lon. Built from the up-to-four 256px tiles that the window overlaps.
  function aerialPhoto(r) {
    var z = 18, size = 256, world = 256 * Math.pow(2, z);
    var latRad = r.lat * Math.PI / 180;
    var px = (r.lon + 180) / 360 * world;
    var py = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * world;
    var left = Math.round(px - size / 2), top = Math.round(py - size / 2);
    var frame = h('div', { class: 'aerial-frame', role: 'img',
      'aria-label': 'Aerial photo of ' + (r.name || 'this greenhouse') + ', 2025' });
    var figure = h('figure', { class: 'aerial' },
      [frame, h('figcaption', { text: 'Aerial imagery 2025, MassGIS' })]);
    for (var ty = Math.floor(top / 256); ty <= Math.floor((top + size - 1) / 256); ty++) {
      for (var tx = Math.floor(left / 256); tx <= Math.floor((left + size - 1) / 256); tx++) {
        var img = h('img', { alt: '', width: '256', height: '256', decoding: 'async',
          src: AERIAL_2025.replace('{z}', z).replace('{y}', ty).replace('{x}', tx) });
        img.style.left = (tx * 256 - left) + 'px';
        img.style.top = (ty * 256 - top) + 'px';
        img.addEventListener('error', function () { figure.hidden = true; });
        frame.appendChild(img);
      }
    }
    return figure;
  }

  function section(label, children) {
    return h('section', { class: 'section' }, [label ? h('h3', { text: label }) : null].concat(children));
  }

  function select(r) {
    if (selectedId && layerById[selectedId]) {
      var prevRec = PROFILES.find(function (x) { return x.id === selectedId; });
      layerById[selectedId].setStyle(baseStyle(prevRec));
    }
    selectedId = r.id;
    layerById[r.id].setStyle({ color: '#000', weight: 3 }).bringToFront();
    if (jump.value !== r.id) jump.value = r.id;

    renderPanel(r);
    if (window.AgentView) AgentView.render(r);
  }

  function renderPanel(r) {
    panel.textContent = '';

    // Name, then "Town · area"; town omitted if missing.
    var title = h('h2', { tabindex: '-1', text: r.name || 'Unnamed greenhouse' });
    panel.appendChild(title);
    panel.appendChild(h('p', { class: 'meta', text: (r.town ? r.town + ' · ' : '') + int(r.sqft) + ' sq ft' }));
    panel.appendChild(aerialPhoto(r));

    // Range bar
    var bar = new RangeBar(r.estimate);
    panel.appendChild(section(null, [bar.root]));
    bar.show(r.estimate, false);

    // Calibration
    var inputId = 'gallons-' + r.id.replace(/[^a-z0-9]/gi, '-');
    var input = h('input', { id: inputId, type: 'number', inputmode: 'decimal', min: '0', step: 'any' });
    var submit = h('button', { type: 'submit', text: 'Narrow the estimate' });
    var reset = h('button', { type: 'button', class: 'secondary', text: 'Reset' });
    var err = h('p', { class: 'error', role: 'alert' });
    err.hidden = true;
    var form = h('form', { class: 'calibrate' }, [
      h('label', { for: inputId, text: 'Gallons burned last winter' }), input, submit, reset
    ]);
    panel.appendChild(section('Narrow it down', [form, err]));

    function apply() {
      err.hidden = true;
      var raw = input.value.trim();
      if (raw === '') { showBaseline(); return; }
      var gallons = Number(raw);
      try {
        var calibrated = Calc.calibrate(r, gallons);
        var calibratedFixes = Calc.rankedFixes(calibrated.point.usd, r.covering);
        bar.show(calibrated, true);
        renderFixes(
          calibratedFixes,
          'Against your calibrated estimate of ' + usd(calibrated.point.usd) + '.'
        );
        // Shallow copy for the agents; evidence is copied too so the original
        // record's nested object is never mutated.
        var view = Object.assign({}, r, {
          estimate: calibrated,
          fixes: calibratedFixes,
          evidence: Object.assign({}, r.evidence, { bill_uploaded: true })
        });
        if (window.AgentView) AgentView.render(view);
      } catch (e) {
        err.textContent = 'Enter a number of gallons, zero or more.';
        err.hidden = false;
      }
    }
    // Size-only baseline: the record's own fixes, computed from usd_winter.
    function showBaseline() {
      bar.show(r.estimate, true);
      renderFixes(r.fixes, 'Against the size-only estimate of ' + usd(r.usd_winter) + '.');
      if (window.AgentView) AgentView.render(r);
    }
    form.addEventListener('submit', function (e) { e.preventDefault(); apply(); });
    input.addEventListener('change', apply);
    reset.addEventListener('click', function () {
      input.value = '';
      err.hidden = true;
      showBaseline();
      input.focus();
    });

    // Fixes (re-rendered in place when the estimate is calibrated or reset)
    var fixesBox = h('div', { 'aria-live': 'polite' });
    panel.appendChild(section('Ranked fixes', [fixesBox]));
    function renderFixes(fixes, baselineText) {
      fixesBox.textContent = '';
      if (!fixes || !fixes.length) {
        fixesBox.appendChild(h('p', { class: 'note', text: 'No fixes listed for this building.' }));
        return;
      }
      var body = h('tbody');
      fixes.forEach(function (f) {
        body.appendChild(h('tr', null, [
          h('th', { scope: 'row', text: f.name }),
          h('td', { class: 'num usd', text: usd(f.saves_usd) })
        ]));
      });
      fixesBox.appendChild(h('table', { class: 'report-table' }, [
        h('thead', null, [h('tr', null, [
          h('th', { scope: 'col', text: 'Fix' }),
          h('th', { scope: 'col', text: 'Saves per winter' })
        ])]),
        body
      ]));
      fixesBox.appendChild(h('p', { class: 'note', text: baselineText }));
      fixesBox.appendChild(h('p', { class: 'note', text: 'Savings per winter. No vendor quotes yet, so costs are not shown.' }));
    }
    renderFixes(r.fixes, 'Against the size-only estimate of ' + usd(r.usd_winter) + '.');

    // Assumptions
    panel.appendChild(section('Assumptions', [h('table', { class: 'report-table' }, [h('tbody', null, [
      h('tr', null, [h('th', { scope: 'row', text: 'Covering' }), h('td', { text: r.covering })]),
      h('tr', null, [h('th', { scope: 'row', text: 'Fuel price' }), h('td', { class: 'num' }, [
        h('span', { class: 'usd', text: '$' + r.price_per_gal.toFixed(2) }),
        document.createTextNode(' per gallon')
      ])])
    ])])]));

    title.focus({ preventScroll: true });
  }
})();
</script>
